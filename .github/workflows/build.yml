name: Build APK

on:
  workflow_dispatch:      # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Installer Buildozer
        run: pip install --upgrade pip buildozer Cython==0.29.37 virtualenv

      - name: Construire l'APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Afficher la vraie erreur
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log | grep -v '^# ' > clean.log
          echo "===== LIGNES CONTENANT UNE ERREUR ====="
          grep -n -i -E "command failed|error:|fatal|traceback|no such file|not found| failed" clean.log | tail -n 25
          echo "===== DERNIERES LIGNES (sans les variables d'environnement) ====="
          tail -n 60 clean.log

      - name: Publier le journal complet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: clavier-bluetooth-apk
          path: bin/*.apk
